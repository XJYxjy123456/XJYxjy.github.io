<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI检测与修复一体化系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#5b21b6',
                        lightPurple: '#f5f3ff',
                        softPurple: '#ddd6fe',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-shadow {
                box-shadow: 0 8px 30px rgba(91, 33, 182, 0.08);
            }
            .gradient-purple {
                background: linear-gradient(135deg, #c4b5fd 0%, #a78bfa 50%, #7c3aed 100%);
            }
            .glass {
                background: rgba(255,255,255,0.7);
                backdrop-filter: blur(8px);
            }
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-700">
    <div class="flex h-screen overflow-hidden">
        <!-- 侧边栏 -->
        <aside class="w-16 lg:w-64 bg-white card-shadow flex flex-col transition-all duration-300">
            <div class="h-16 flex items-center justify-center lg:justify-start px-4 border-b border-slate-100">
                <span class="text-primary font-bold text-xl hidden lg:block">AI检测修复系统</span>
                <i class="fa fa-cube text-primary text-xl lg:hidden"></i>
            </div>
            <nav class="flex-1 py-6 px-2 lg:px-4 space-y-2">
                <a href=" " class="menu-item flex items-center gap-3 px-3 py-3 rounded-xl bg-primary text-white" data-target="workbench">
                    <i class="fa fa-home w-5 text-center"></i>
                    <span class="hidden lg:block">工作台</span>
                </a >
                <a href="#" class="menu-item flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-lightPurple transition" data-target="video">
                    <i class="fa fa-video-camera w-5 text-center"></i>
                    <span class="hidden lg:block">视频检测</span>
                </a >
                <a href="#" class="menu-item flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-lightPurple transition" data-target="script">
                    <i class="fa fa-file-text w-5 text-center"></i>
                    <span class="hidden lg:block">剧本合规预审</span>
                </a >
                <a href="#" class="menu-item flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-lightPurple transition" data-target="quota">
                    <i class="fa fa-tachometer w-5 text-center"></i>
                    <span class="hidden lg:block">额度面板</span>
                </a >
                <a href="#" class="menu-item flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-lightPurple transition" data-target="apikey">
                    <i class="fa fa-key w-5 text-center"></i>
                    <span class="hidden lg:block">API密钥</span>
                </a >
                <a href="#" class="menu-item flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-lightPurple transition" data-target="record">
                    <i class="fa fa-list-alt w-5 text-center"></i>
                    <span class="hidden lg:block">检测记录</span>
                </a >
                <a href="#" class="menu-item flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-lightPurple transition" data-target="package">
                    <i class="fa fa-credit-card w-5 text-center"></i>
                    <span class="hidden lg:block">套餐方案</span>
                </a >
            </nav>
        </aside>

        <!-- 主区域 -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- 顶部导航 -->
            <header class="h-16 bg-white card-shadow flex items-center justify-between px-4 lg:px-8">
                <div class="flex items-center gap-2">
                    <button class="top-tab px-4 py-2 rounded-full bg-primary text-white text-sm" data-target="workbench">工作台</button>
                    <button class="top-tab px-4 py-2 rounded-full hover:bg-lightPurple text-sm" data-target="video">视频检测</button>
                    <button class="top-tab px-4 py-2 rounded-full hover:bg-lightPurple text-sm" data-target="script">剧本预审</button>
                    <button class="top-tab px-4 py-2 rounded-full hover:bg-lightPurple text-sm" data-target="quota">额度面板</button>
                    <button class="top-tab px-4 py-2 rounded-full hover:bg-lightPurple text-sm" data-target="apikey">API密钥</button>
                    <button class="top-tab px-4 py-2 rounded-full hover:bg-lightPurple text-sm" data-target="record">检测记录</button>
                    <button class="top-tab px-4 py-2 rounded-full hover:bg-lightPurple text-sm" data-target="package">套餐方案</button>
                </div>
                <div class="flex items-center gap-4">
                    <div class="relative hidden md:block">
                        <input type="text" placeholder="搜索任务、文件ID..." class="bg-slate-50 rounded-full pl-10 pr-4 py-2 w-60 outline-none focus:ring-2 focus:ring-primary/30">
                        <i class="fa fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    </div>
                    <i class="fa fa-bell-o text-slate-500 cursor-pointer"></i>
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full gradient-purple"></div>
                        <span class="hidden md:block text-sm font-medium">管理员</span>
                    </div>
                </div>
            </header>

            <!-- 内容区 -->
            <main class="flex-1 overflow-y-auto p-4 lg:p-8">
                <div class="max-w-7xl mx-auto">
                    <!-- ========== 工作台页面 ========== -->
                    <section id="workbench" class="page-content">
                        <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6">
                            <div>
                                <h1 class="text-[clamp(1.4rem,3vw,2rem)] font-bold text-slate-800">欢迎回来，管理员</h1>
                                <p class="text-slate-500 mt-1">当前有 8 项待处理检测修复任务！</p >
                            </div>
                            <div class="flex gap-3 mt-4 md:mt-0">
                                <button class="bg-primary text-white px-5 py-2 rounded-full flex items-center gap-2 hover:bg-primary/90 transition">
                                    <i class="fa fa-plus"></i> 新建检测任务
                                </button>
