<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI检测与修复一体化系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#253648',
            secondary: '#6897bb',
            accent: '#c79a68',
            neutral: '#f7f8fa',
          },
          fontFamily: {
            inter: ['system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .nav-item {
        @apply flex items-center gap-3 px-4 py-2.5 rounded-md transition-all duration-200 text-gray-600 hover:bg-primary/10 hover:text-primary;
      }
      .nav-item.active {
        @apply bg-primary/15 text-primary font-medium;
      }
      .card {
        @apply bg-white rounded-lg border border-gray-100 shadow-sm px-6 py-5;
      }
      .btn-primary {
        @apply bg-accent hover:bg-[#b68b5c] text-white px-5 py-2 rounded transition-all;
      }
      .btn-default {
        @apply border border-gray-200 hover:border-gray-50 px-5 py-2 rounded transition-all;
      }
    }
  </style>
</head>
<body class="font-inter bg-neutral text-gray-800">
  <div class="flex h-screen overflow-hidden">
    <aside class="w-64 bg-white border-r border-gray-100 flex flex-col">
      <div class="p-5 border-b border-gray-100">
        <h1 class="text-lg font-bold text-primary">AI检测与修复系统</h1>
      </div>
      <nav class="flex-1 p-4 space-y-1">
        <a href=" " class="nav-item active">首页概览</a >
        <a href="#" class="nav-item">图像检测</a >
        <a href="#" class="nav-item">一键修复</a >
        <a href="#" class="nav-item">历史记录</a >
        <a href="#" class="nav-item">系统设置</a >
      </nav>
    </aside>
    <main class="flex-1 overflow-auto p-6">
      <h2 class="text-xl font-semibold mb-6">欢迎使用 AI 检测与修复一体化系统</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="card">
          <h3 class="font-medium text-lg mb-3">上传素材</h3>
          <p class="text-gray-500 mb-4">上传图片，自动进行瑕疵检测与智能修复</p >
          <button class="btn-primary">选择文件上传</button>
        </div>
        <div class="card">
          <h3 class="font-medium text-lg mb-3">快速任务</h3>
          <p class="text-gray-500 mb-4">查看正在处理、等待中的任务进度</p >
          <button class="btn-default">查看任务列表</button>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
