<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 检测与修复一体化系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f4f7fb;
            color: #2c3e50;
            display: flex;
            min-height: 100vh;
        }
        /* 侧边栏 */
        .sidebar {
            width: 220px;
            background: linear-gradient(180deg, #165DFF, #0F48D8);
            color: white;
            padding: 30px 16px;
        }
        .sidebar-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 36px;
            letter-spacing: 1px;
        }
        .sidebar-menu a {
            display: block;
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: 0.25s;
            font-size: 14px;
        }
        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: rgba(255,255,255,0.18);
            color: #fff;
        }
        /* 主区域 */
        .main {
            flex: 1;
            padding: 36px 48px;
        }
        .page-header {
            margin-bottom: 28px;
        }
        .page-header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .page-header p {
            color: #748396;
            font-size: 14px;
        }
        .container-row {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
        }
        .card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(22, 93, 255, 0.08);
            padding: 28px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        /* 上传区域 */
        .upload-area {
            border: 2px dashed #c8d7f0;
            border-radius: 12px;
            padding: 50px 20px;
            text-align: center;
            transition: 0.25s;
            cursor: pointer;
        }
        .upload-area:hover {
            border-color: #165DFF;
            background-color: #f7faff;
        }
        .upload-area.drag-over {
            border-color: #165DFF;
            background-color: #eef4ff;
        }
        .upload-icon {
            font-size: 42px;
            color: #165DFF;
            margin-bottom: 14px;
        }
        .upload-tip {
            font-size: 14px;
            color: #6b7a90;
            margin-bottom: 16px;
        }
        .upload-btn {
            background-color: #165DFF;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.25s;
        }
        .upload-btn:hover {
            background-color: #0F48D8;
        }
        input#fileInput {
            display: none;
        }
        /* 右侧任务面板 */
        .task-item {
            padding: 14px 0;
            border-bottom: 1px solid #f0f2f7;
        }
        .task-item:last-child {
            border-bottom: none;
        }
        .task-name {
            font-size: 14px;
            margin-bottom: 6px;
        }
        .task-status {
            font-size: 13px;
            color: #748396;
        }
        .status-running {
            color: #ff7d00;
        }
        .status-success {
            color: #00b42a;
        }
        /* 加载动画 */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #c8d7f0;
            border-top-color: #165DFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .footer-note {
            margin-top: 30px;
            font-size: 13px;
            color: #94a2b6;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-title">AI 检测修复系统</div>
        <div class="sidebar-menu">
            <a href=" " class="active">首页概览</a >
            <a href="#">图像检测</a >
            <a href="#">一键修复</a >
            <a href="#">历史记录</a >
            <a href="#">系统设置</a >
        </div>
    </div>

    <div class="main">
        <div class="page-header">
            <h1>欢迎使用 AI 检测与修复一体化系统</h1>
            <p>上传图片，自动进行画质检测与智能修复</p >
        </div>
        <div class="container-row">
            <div class="card">
                <div class="card-title">上传素材</div>
                <div class="upload-area" id="uploadBox">
                    <div class="upload-icon">⬆</div>
                    <div class="upload-tip">点击选择文件，或将图片拖拽到此处上传</div>
                    <button class="upload-btn">选择文件上传</button>
                    <input type="file" id="fileInput" accept="image/*" multiple>
                </div>
                <div class="footer-note">支持 JPG / PNG / WEBP，单次可多选图片上传</div>
            </div>

            <div class="card">
                <div class="card-title">快速任务</div>
                <div class="task-item">
                    <div class="task-name">查看正在处理</div>
                    <div class="task-status">等待你的上传任务</div>
                </div>
                <div class="task-item">
                    <div class="task-name">查看任务列表</div>
                    <div class="task-status">暂无历史任务</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadBox = document.getElementById('uploadBox');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.querySelector('.upload-btn');

        uploadBtn.addEventListener('click', () => fileInput.click());

        // 拖拽
        uploadBox.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadBox.classList.add('drag-over');
        });
        uploadBox.addEventListener('dragleave', () => {
            uploadBox.classList.remove('drag-over');
        });
        uploadBox.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadBox.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            handleFiles(files);
        });
        fileInput.addEventListener('change', () => {
            handleFiles(fileInput.files);
        });

        function handleFiles(files) {
            if (!files.length) return;
            alert(`已选中 ${files.length} 张图片\n（这里后面可以对接 AI 接口，开始检测修复）`);
        }
    </script>
</body>
</html>
